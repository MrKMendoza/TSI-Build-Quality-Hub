    const ty=ro?`<div class="mut">${QT[q.type]}${q.src?' · '+esc(q.src):''}</div>`:`<div class="row" style="margin:6px 0"><select onchange="pkType(${k},this.value)">${Object.entries(QT).map(([a,b])=>`<option value="${a}" ${q.type==a?'selected':''}>${b}</option>`).join('')}</select><span class="mut" style="font-size:12px">${q.src?esc(q.src):''}</span></div>`;
    const qt=ro?`<p>${esc(q.q)}</p>`:`<textarea rows="2" oninput="S.mo.d.questions[${k}].q=this.value" placeholder="Question" style="width:100%">${esc(q.q)}</textarea>`;
    let bd='';
    if(q.type=='mc')bd=q.choices.map((c,i)=>`<div class="row" style="margin:4px 0;flex-wrap:nowrap"><input type="radio" name="a${k}" ${q.answer==i?'checked':''} ${ro?'disabled':''} onchange="S.mo.d.questions[${k}].answer=${i}" aria-label="Correct answer"><input value="${esc(c)}" ${ro?'disabled':''} oninput="S.mo.d.questions[${k}].choices[${i}]=this.value" placeholder="Choice ${String.fromCharCode(65+i)}" style="flex:1"></div>`).join('')+(ro||q.choices.length>=6?'':`<button class="btn g" onclick="pkAddCh(${k})">+ Choice</button>`)+'<div class="mut" style="font-size:12px">Select the dot next to the correct choice.</div>';
    else if(q.type=='tf')bd=`<div><label>Correct answer</label><select ${ro?'disabled':''} onchange="S.mo.d.questions[${k}].answer=this.value=='true'"><option value="true" ${q.answer?'selected':''}>True</option><option value="false" ${q.answer?'':'selected'}>False</option></select></div>`;
    else bd=`<div><label>Accepted answers (one per line)</label><textarea rows="2" ${ro?'disabled':''} oninput="S.mo.d.questions[${k}].answers=this.value.split('\\n')" style="width:100%">${esc((q.answers||[]).join('\n'))}</textarea></div>`;
    return`<div class="card" style="margin:10px 0">${sw}${ty}${qt}${bd}<div style="margin-top:6px"><label>Why (shown after the exam)</label>${ro?`<div>${esc(q.explain)||'—'}</div>`:`<input value="${esc(q.explain||'')}" oninput="S.mo.d.questions[${k}].explain=this.value" style="width:100%">`}</div></div>`};
  const ex=S.pk.find(x=>x.id==S.mo.id);

function pkErr(d,pub){if(!d.title)return'Give the exam a title';if(!pub)return'';if(!/^\d{4}-\d{2}-\d{2}$/.test(d.week)||monOf(d.week)!=d.week)return'The week must start on a Monday';if(!/^\d{4}-\d{2}-\d{2}$/.test(d.due)||d.due<d.week)return'Pick a due date on or after the start of the week';if(!(+d.pass>=1&&+d.pass<=100))return'Pass mark must be between 1 and 100';if(!(+d.maxAtt>=1&&+d.maxAtt<=5))return'Attempts must be between 1 and 5';if(!d.questions.length)return'Add at least one question';for(let i=0;i<d.questions.length;i++){const q=d.questions[i],n='Question '+(i+1)+': ';if(q.q.length<5)return n+'write the question';if(q.type=='mc'){if(q.choices.length<2)return n+'needs at least two choices';if(!(q.answer>=0&&q.answer<q.choices.length))return n+'select the correct choice'}if(q.type=='id'&&!q.answers.length)return n+'add at least one accepted answer'}return''}
async function savePk(pub){const d=S.mo.d;if(d.status!='draft')return;d.title=String(d.title||'').trim();d.pass=+d.pass||80;d.maxAtt=+d.maxAtt||2;
  d.questions.forEach(q=>{q.q=String(q.q||'').trim();q.explain=String(q.explain||'').trim();if(q.type=='mc'){const a=String(q.choices[q.answer]||'').trim(),keep=q.choices.map(c=>String(c).trim()).filter(Boolean);q.answer=keep.indexOf(a);q.choices=keep}if(q.type=='id')q.answers=(q.answers||[]).map(x=>String(x).trim()).filter(Boolean)});
  const er=pkErr(d,pub);if(er){pkR();return toast(er)}
  if(pub){let sid=S.mo.id;try{sid=await put('pkt',{...d,ts:d.ts||Date.now()},S.mo.id||undefined)}catch(e){return toast(e.message||String(e))}S.pkPend={d:JSON.parse(JSON.stringify(d)),id:sid};return ask('Publish this PKT? Your edits are saved as a draft first. Make sure every question and answer is correct. The required team members are notified and the exam can no longer be edited.','Publish',doPubPk)}

async function closePk(id){const e=S.pk.find(x=>x.id==id);if(!e)return;try{await put('pkt',{...e,status:'closed'},id);closeMo();toast('Exam closed');draw()}catch(x){toast(x.message||String(x))}}

const startCal=()=>{if(!canWork())return toast('View only: only QAs and Team Leads can run audits');S.v='run';start();if(S.run)S.run.cal=1;draw()};
function calibView(){const ss=calSessions(),dn2=ss.filter(s=>s.n>1),al={},dis={};dn2.forEach(s=>{Object.entries(s.al).forEach(([q,v])=>{const o=al[q]=al[q]||{m:0,n:0,s:0};o.m+=v.m;o.n+=v.n;o.s++});s.dis.forEach(d=>dis[d.t]=(dis[d.t]||0)+1)});const tp=Object.entries(dis).sort((a,b)=>b[1]-a[1])[0];
  return hero('QA Calibration','Same build, several QAs, one standard. Agreement shows who calls it differently.',[['Sessions',dn2.length,'with 2+ QAs','calib','--ac'],['Avg agreement',pct(mAvg(dn2.map(s=>s.pct))),'target 90%+','dash','--ok'],['QAs participating',Object.keys(al).length,'','team','--ac'],['Most disputed',tp?tp[1]+'×':'—',tp?esc(tp[0].slice(0,26)):'no disputes yet','srch','--warn']],{eb:'Consistency'})+
  `<div class="card row"><span style="flex:1"><b>How it works:</b> a lead picks one finished build. Each QA audits that same GPID on their own. Calibration audits never touch the dashboards.</span>${canWork()?'<button class="btn" onclick="startCal()">Start calibration audit</button>':''}</div><div class="grid g2"><div class="card"><h3>Sessions</h3>${tbl(['GPID','Date','QAs','Agreement','Disagreements',''],ss.map(s=>[esc(s.g),D(s.ts),s.l.map(r=>esc(r.qa.split(' ')[0])).join(', '),s.n>1?`<span class="pill ${s.pct>=90?'ok':s.pct>=75?'wn':'no'}">${pct(s.pct)}</span>`:'<span class="mut">waiting for another QA</span>',s.n>1?s.dis.length:'—',s.n>1?`<button class="btn g" onclick="S.mo={t:'cal',g:'${esc(s.g)}'};drawMo()">Details</button>`:'']))}</div><div class="card"><h3>QA alignment with the group</h3>${bars(Object.entries(al).map(([q,v])=>[q,v.m/v.n*100,pct(v.m/v.n*100)+' · '+v.s+' session(s)']).sort((a,b)=>b[1]-a[1]),'var(--ac)')}</div></div>`}
function calMo(){const s=calSessions().find(x=>x.g==S.mo.g);if(!s)return mh('Session');return mh('Calibration · GPID '+esc(s.g))+`<p class="mut">${s.n} QAs · agreement ${pct(s.pct)} · ${s.dis.length} disagreement(s)</p><div class="wrap" style="max-height:50vh">${tbl(['Checkpoint',...s.l.map(r=>esc(r.qa))],s.dis.map(d=>[esc(d.t),...d.v.map(v=>`<span class="pill ${v=='p'?'ok':v=='f'?'no':'wn'}">${LB[v]||'—'}</span>`)]))}</div>${s.dis.length?'':'<div class="empty">Everyone agreed on every checkpoint</div>'}<div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" onclick="closeMo()">Close</button></div>`}
/* client feedback, read-only view */
function extvMo(){const r=S.ex.find(x=>x.id==S.mo.id);if(!r)return mh('Client feedback');const L={missed:'Missed by internal QA',flagged:'Flagged internally',none:'No internal audit'};return mh('Client feedback · GPID '+esc(r.gpid))+`<p class="mut">${r.date} · web designer ${esc(exDesR(r))}</p>${(r.errs||[]).map(q=>`<div class="fl"><b>${esc(q.t)}</b> <span class="mut">${esc(q.cat)}</span> <span class="pill ${exSt(r.gpid,q.t)=='flagged'?'wn':'no'}">${L[exSt(r.gpid,q.t)]}</span><div class="mut" style="font-size:12px">${esc(q.note)}</div></div>`).join('')||'<div class="empty">The client passed this build with no errors</div>'}<div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" onclick="closeMo()">Close</button></div>`}
init();
</script></body></html>
